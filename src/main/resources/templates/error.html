<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Notice - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
        <div class="corporate-card p-5 text-center shadow-sm" style="max-width: 540px; border-radius: 12px;">
            <div class="mb-4">
                <i class="bi bi-shield-exclamation text-primary" style="font-size: 4rem;"></i>
            </div>
            
            <h3 class="fw-bold text-navy mb-2" th:text="${status != null ? 'Error ' + status : 'Application Notice'}">Application Notice</h3>
            <p class="text-secondary mb-4" th:text="${message != null and !message.isEmpty() ? message : 'The requested resource or page encountered an unexpected issue.'}">
                The requested resource or page encountered an unexpected issue.
            </p>

            <div class="d-flex gap-3 justify-content-center">
                <a th:href="@{/dashboard}" class="btn btn-boeing-primary px-4 py-2">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                </a>
                <a th:href="@{/login}" class="btn btn-boeing-secondary px-4 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </a>
            </div>
        </div>
        
        <div class="mt-4 text-center text-muted small">
            Library Management System &bull; Boeing Corporate Edition &bull; Java 17
        </div>
    </div>

</body>
</html>
